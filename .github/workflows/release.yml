name: Build & Release FreeSwarm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0)'
        required: true

env:
  ROUTER_VERSION: 0.3.89
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.13'

jobs:
  # macOS arm64 build
  build-macos-arm64:
    runs-on: macos-latest-xlarge
    if: contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          npm ci
          cd router && npm ci && cd ..
          cd backend && pip install -r requirements.txt && cd ..

      - name: Build Router
        run: |
          cd router
          npm run build
          cd ..

      - name: Build Application (arm64)
        env:
          ARCH: 'arm64'
        run: bash scripts/build-app.sh

      - name: Notarize DMG (macOS)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ]; then
            DMG=$(find electron/dist -name "*.dmg" -type f)
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG"
          else
            echo "Skipping notarization: Apple credentials not configured"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeswarm-macos-arm64
          path: electron/dist/FreeSwarm-arm64.dmg

  # macOS x64 build
  build-macos-x64:
    runs-on: macos-latest
    if: contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          npm ci
          cd router && npm ci && cd ..
          cd backend && pip install -r requirements.txt && cd ..

      - name: Build Router
        run: |
          cd router
          npm run build
          cd ..

      - name: Build Application (x64)
        env:
          ARCH: 'x64'
        run: bash scripts/build-app.sh

      - name: Notarize DMG (macOS)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ]; then
            DMG=$(find electron/dist -name "*.dmg" -type f)
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG"
          else
            echo "Skipping notarization: Apple credentials not configured"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeswarm-macos-x64
          path: electron/dist/FreeSwarm-x64.dmg

  # Windows x64 build
  build-windows-x64:
    runs-on: windows-latest
    if: contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (Windows)
        run: |
          npm ci
          cd router && npm ci && cd ..
          cd backend && pip install -r requirements.txt && cd ..
        shell: bash

      - name: Build Router
        run: |
          cd router
          npm run build
          cd ..
        shell: bash

      - name: Build Application (Windows)
        run: bash scripts/build-app-win.ps1
        shell: bash

      - name: Sign EXE (Azure Code Signing)
        env:
          AZURE_KEY_VAULT: ${{ secrets.AZURE_KEY_VAULT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$AZURE_KEY_VAULT" ]; then
            # Install azure-codesigntool
            npm install -g @microsoft/azure-codesigntool

            EXE=$(find electron/dist -name "*.exe" -type f)
            azure-codesigntool sign \
              --vault-name "$AZURE_KEY_VAULT" \
              --certificate freeswarm-prod \
              --file-digest sha256 \
              --timestamp-rfc3161 http://timestamp.sectigo.com \
              "$EXE"
          else
            echo "Skipping signing: Azure credentials not configured"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeswarm-windows-x64
          path: electron/dist/FreeSwarm-Setup-x64.exe

  # Create GitHub Release
  publish-release:
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          # Extract changelog from CHANGELOG.md
          VERSION=${{ steps.version.outputs.version }}
          CHANGELOG=$(sed -n "/^## $VERSION/,/^## /p" CHANGELOG.md | head -n -1)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            artifacts/freeswarm-macos-arm64/*.dmg
            artifacts/freeswarm-macos-x64/*.dmg
            artifacts/freeswarm-windows-x64/*.exe
          body: |
            # FreeSwarm Router ${{ steps.version.outputs.version }}

            ## Download

            - **macOS (Apple Silicon)**: `FreeSwarm-arm64.dmg`
            - **macOS (Intel)**: `FreeSwarm-x64.dmg`
            - **Windows (x64)**: `FreeSwarm-Setup-x64.exe`

            ## What's New

            ${{ steps.changelog.outputs.changelog }}

            ## Verification

            ```bash
            # Verify macOS notarization
            spctl -a -v -t install -e allow FreeSwarm.app

            # Check Windows signature
            sigcheck64 FreeSwarm-Setup-x64.exe
            ```

            ## Installation

            1. Download the appropriate file for your platform
            2. Run the installer
            3. Follow on-screen instructions
            4. Launch FreeSwarm

            See [INSTALLATION.md](https://github.com/yethikrishna/free-swarm/blob/main/docs/INSTALLATION.md) for detailed instructions.

            ---

            **Release Date**: ${{ github.event.head_commit.timestamp }}
            **Git Commit**: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish Docker Image (optional)
  publish-docker:
    runs-on: ubuntu-latest
    if: contains(github.ref, 'refs/tags/')
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            freeswarm/router:${{ steps.version.outputs.version }}
            freeswarm/router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Post-Release Notifications
  notify-release:
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        if: success()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🚀 FreeSwarm Router ${{ steps.version.outputs.version }} Released!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*FreeSwarm Router ${{ steps.version.outputs.version }}* is now available!\n\n<https://github.com/yethikrishna/free-swarm/releases/tag/${{ steps.version.outputs.version }}|View Release>"
                  }
                }
              ]
            }

      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        if: success()
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "FreeSwarm Router ${{ steps.version.outputs.version }} Released"
          description: |
            🎉 New release available on GitHub

            📥 Downloads:
            - macOS arm64 (M1/M2): FreeSwarm-arm64.dmg
            - macOS x64 (Intel): FreeSwarm-x64.dmg
            - Windows x64: FreeSwarm-Setup-x64.exe

# Job Status Summary
  build-status:
    runs-on: ubuntu-latest
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64, publish-release]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-macos-arm64.result }}" = "failure" ] || \
             [ "${{ needs.build-macos-x64.result }}" = "failure" ] || \
             [ "${{ needs.build-windows-x64.result }}" = "failure" ] || \
             [ "${{ needs.publish-release.result }}" = "failure" ]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds succeeded"
          fi
